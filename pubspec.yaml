name: smartfit_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  shared_preferences: ^2.5.5
  flutter_blue_plus: ^2.3.12
  fl_chart: ^1.2.0
  image_picker: ^1.2.3
  camera: ^0.12.0+2
  dio: ^5.11.0
  flutter_local_notifications: ^22.3.0
  vibration: ^3.2.0
  permission_handler: ^13.0.1
  flutter_dotenv: ^6.0.1
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/smartfit.png

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/smartfit_icon_full.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#1DB954"
  adaptive_icon_foreground: "assets/images/smartfit_mark_transparent.png"